# Netlify — Alternative Behavioral Therapy (neurofeedbackcare.com)
# Repo layout on GitHub: neurofeedbackcare-source/ is the project root.
# In Netlify UI set Base directory = neurofeedbackcare-source
# so this file and package.json are found.

[build]
  command = "npm run build:netlify"
  # Official TanStack Start + Netlify plugin publishes the client bundle here.
  # Server/SSR functions are emitted alongside and picked up by Netlify.
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  # Skip optional tooling noise in CI
  NPM_FLAGS = "--no-audit --no-fund"

# SPA-style deep links are handled by TanStack Start SSR on Netlify.
# No blanket /* → /index.html rewrite — that breaks SSR + assets.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/team/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/clinic/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/credentials/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Same-domain cutover: old GoDaddy Website Builder paths → current pages.
# One hop only. Hash targets are the final URL (no second redirect).
# www and http are forced to https://neurofeedbackcare.com.

[[redirects]]
  from = "https://www.neurofeedbackcare.com/*"
  to = "https://neurofeedbackcare.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.neurofeedbackcare.com/*"
  to = "https://neurofeedbackcare.com/:splat"
  status = 301
  force = true

[[redirects]]
